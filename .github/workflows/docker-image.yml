name: Docker image CI

# The PR gate. Three layers: the base image -- the compiler's own published image at the pinned
# commit (ghcr.io/psal-postech/pytorchsim-triton-backend:<ref>, one tag per commit from that
# repository's images workflow) plus PyTorch and the test stack, built once per pin and reused
# (scripts/ci/thirdparty_base_pin.sh) -- the app image for this commit, and one container per
# allowlisted test (pytorchsim_test.yml). Nothing of the compiler, Triton, Spike or gem5 is
# built here. The compiler's package grants this repository read access, so the default Actions
# token is all the registry needs.
on:
  pull_request:
    branches: [ "master", "develop", "pytorchsim-triton-backend" ]
  workflow_dispatch:

env:
  BASE_IMAGE_REPO: ghcr.io/psal-postech/torchsim_base
  PTB_IMAGE_REPO: ghcr.io/psal-postech/pytorchsim-triton-backend
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  ensure-base:
    name: Base image on the compiler's
    # The compiler image is ~10 GB: a GitHub-hosted runner's disk is not the place to layer on it.
    runs-on: [self-hosted, slurm, big, x86_64]
    outputs:
      base_image: ${{ steps.pin.outputs.base_image }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pins
        id: pin
        run: |
          PTB_REF=$(jq -r '.pytorchsim_triton_backend.ref' thirdparty/pytorchsim-triton-backend.json)
          PIN="$(bash scripts/ci/thirdparty_base_pin.sh)"
          echo "PTB_IMAGE=${PTB_IMAGE_REPO}:${PTB_REF}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=${BASE_IMAGE_REPO}:thirdparty-${PIN}" >> "$GITHUB_ENV"
          echo "base_image=${BASE_IMAGE_REPO}:thirdparty-${PIN}" >> "$GITHUB_OUTPUT"

      - name: The compiler has published an image for the pin
        run: |
          if ! docker manifest inspect "${PTB_IMAGE}" > /dev/null 2>&1; then
            echo "::error::${PTB_IMAGE} is not in the registry. PSAL-POSTECH/PyTorchSim-Triton-Backend's images workflow pushes one tag per commit on its main and develop; a pin on any other branch has no image. If the tag does exist, this repository has lost read access to the package (its settings: Manage Actions access)."
            exit 1
          fi

      - name: Check base image exists
        id: exists
        run: |
          if docker manifest inspect "${BASE_IMAGE}" > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push base image (missing pin)
        if: steps.exists.outputs.ok != 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          build-args: |
            PTB_IMAGE=${{ env.PTB_IMAGE }}
          tags: ${{ env.BASE_IMAGE }}

  build-and-test:
    needs: ensure-base
    runs-on: [self-hosted, slurm, big, x86_64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          build-args: |
            BASE_IMAGE=${{ needs.ensure-base.outputs.base_image }}
          tags: ghcr.io/psal-postech/torchsim-test:${{ env.SOURCE_SHA }}

      - name: Wait for GHCR propagation
        env:
          IMAGE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          IMG="ghcr.io/psal-postech/torchsim-test:${IMAGE_SHA}"
          echo "Verifying tag matches push: ${IMAGE_SHA}"
          for i in $(seq 1 30); do
            echo "Checking if image exists in GHCR (attempt $i)..."
            if docker buildx imagetools inspect "$IMG" > /dev/null 2>&1; then
              echo "Image is now available in GHCR."
              exit 0
            fi
            if [ "$i" -eq 1 ]; then
              echo "buildx imagetools inspect failed; stderr (first attempt):"
              docker buildx imagetools inspect "$IMG" 2>&1 || true
            fi
            echo "Image not yet available, retrying in 20 seconds..."
            sleep 20
          done
          echo "Image did not become available in GHCR within expected time."
          exit 1

  test-pytorchsim-wrapper1:
    needs: build-and-test
    uses: ./.github/workflows/pytorchsim_test.yml
    with:
      image_name: ghcr.io/psal-postech/torchsim-test:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      togsim_config: /workspace/PyTorchSim/configs/systolic_ws_256x256_c1_simple_noc_tpuv6e_functional_only.yml
      run_accuracy: true

  test-pytorchsim-wrapper2:
    needs: build-and-test
    uses: ./.github/workflows/pytorchsim_test.yml
    with:
      image_name: ghcr.io/psal-postech/torchsim-test:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      togsim_config: /workspace/PyTorchSim/configs/systolic_ws_32x32_c1_simple_noc_tpuv3.yml
      run_accuracy: false

  test-pytorchsim-wrapper3:
    needs: build-and-test
    uses: ./.github/workflows/pytorchsim_test.yml
    with:
      image_name: ghcr.io/psal-postech/torchsim-test:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      togsim_config: /workspace/PyTorchSim/configs/systolic_ws_8x8_c1_simple_noc_tpuv3.yml
      run_accuracy: false
