name: Docker image CI

on:
  pull_request:
    branches: [ "master", "develop", "pytorchsim-triton-backend" ]
  workflow_dispatch:

env:
  BASE_IMAGE_REPO: ghcr.io/psal-postech/torchsim_base
  PTB_IMAGE_REPO: ghcr.io/psal-postech/torchsim_ptb_base
  # PR: head commit; otherwise workflow_dispatch uses the branch SHA
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: Check PTB access
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      # The only codegen route lowers through PyTorchSim-Triton-Backend, so the toolchain is
      # not optional and neither is the token. Fail here, not in the image build.
      - name: Token can read the pin
        env:
          PTB_TOKEN: ${{ secrets.TNPU_TOKEN }}
        run: |
          if [ -z "${PTB_TOKEN}" ]; then
            echo "::error::secrets.TNPU_TOKEN is not set. PSAL-POSTECH/PyTorchSim-Triton-Backend is private and the default Actions token cannot read it."
            exit 1
          fi
          REPO=$(jq -r '.pytorchsim_triton_backend.repository' thirdparty/pytorchsim-triton-backend.json)
          REF=$(jq -r '.pytorchsim_triton_backend.ref' thirdparty/pytorchsim-triton-backend.json)
          if ! curl -fsS -H "Authorization: Bearer ${PTB_TOKEN}" \
               "https://api.github.com/repos/${REPO}/commits/${REF}" -o /dev/null; then
            echo "::error::PTB_TOKEN cannot read ${REPO} at ${REF}."
            exit 1
          fi

  ensure-base:
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      base_image: ${{ steps.pin.outputs.base_image }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: PyTorch base image from manifest
        run: |
          PYTORCH_IMAGE=$(python3 -c "import json; from pathlib import Path; v=json.loads(Path('thirdparty/github-releases.json').read_text()).get('pytorch_image'); print(v or '')")
          if [ -z "$PYTORCH_IMAGE" ]; then echo "thirdparty/github-releases.json: pytorch_image is required" >&2; exit 1; fi
          echo "PYTORCH_IMAGE=$PYTORCH_IMAGE" >> "$GITHUB_ENV"

      - name: Thirdparty pin
        id: pin
        run: |
          PIN="$(bash scripts/ci/thirdparty_base_pin.sh)"
          echo "pin=${PIN}" >> "$GITHUB_OUTPUT"
          echo "base_image=${BASE_IMAGE_REPO}:thirdparty-${PIN}" >> "$GITHUB_OUTPUT"
          echo "BASE_IMAGE=${BASE_IMAGE_REPO}:thirdparty-${PIN}" >> "$GITHUB_ENV"

      - name: Check base image exists
        id: exists
        run: |
          if docker manifest inspect "${BASE_IMAGE}" > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push base image (missing pin)
        if: steps.exists.outputs.ok != 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          build-args: |
            PYTORCH_IMAGE=${{ env.PYTORCH_IMAGE }}
          tags: ${{ env.BASE_IMAGE }}

  ensure-ptb-base:
    # The PyTorchSim-Triton-Backend layer the codegen route lowers through, with the
    # simulators it runs. Kept a separate image because it moves on its own pin.
    name: Build PTB toolchain image
    needs: ensure-base
    runs-on: [self-hosted, slurm, big, x86_64]
    outputs:
      ptb_image: ${{ steps.pin.outputs.ptb_image }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pins
        id: pin
        run: |
          BASE_PIN="$(bash scripts/ci/thirdparty_base_pin.sh)"
          PTB_PIN="$(bash scripts/ci/ptb_base_pin.sh)"
          # The PTB layer sits on a specific base, so its tag carries both pins.
          echo "PTB_IMAGE=${PTB_IMAGE_REPO}:ptb-${PTB_PIN}-base-${BASE_PIN}" >> "$GITHUB_ENV"
          echo "ptb_image=${PTB_IMAGE_REPO}:ptb-${PTB_PIN}-base-${BASE_PIN}" >> "$GITHUB_OUTPUT"
          echo "PTB_REF=$(jq -r '.pytorchsim_triton_backend.ref' thirdparty/pytorchsim-triton-backend.json)" >> "$GITHUB_ENV"

      - name: Check PTB image exists
        id: exists
        run: |
          if docker manifest inspect "${PTB_IMAGE}" > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push PTB toolchain image
        if: steps.exists.outputs.ok != 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.ptb
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.ensure-base.outputs.base_image }}
            PTB_REF=${{ env.PTB_REF }}
          secrets: |
            ptb_token=${{ secrets.TNPU_TOKEN }}
          tags: ${{ env.PTB_IMAGE }}

  build-and-test:
    needs: ensure-ptb-base
    # Self-hosted: the app image now carries the PTB toolchain layer.
    runs-on: [self-hosted, slurm, big, x86_64]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          no-cache: true
          build-args: |
            BASE_IMAGE=${{ needs.ensure-ptb-base.outputs.ptb_image }}
          tags: ghcr.io/psal-postech/torchsim-test:${{ env.SOURCE_SHA }}

      # Do not use GITHUB_SHA here: on pull_request it is the merge commit, while the image tag uses SOURCE_SHA (PR head).
      - name: Wait for GHCR propagation
        env:
          IMAGE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          IMG="ghcr.io/psal-postech/torchsim-test:${IMAGE_SHA}"
          echo "Verifying tag matches push: ${IMAGE_SHA}"
          for i in $(seq 1 30); do
            echo "Checking if image exists in GHCR (attempt $i)..."
            if docker buildx imagetools inspect "$IMG" > /dev/null 2>&1; then
              echo "Image is now available in GHCR."
              exit 0
            fi
            if [ "$i" -eq 1 ]; then
              echo "buildx imagetools inspect failed; stderr (first attempt):"
              docker buildx imagetools inspect "$IMG" 2>&1 || true
            fi
            echo "Image not yet available, retrying in 20 seconds..."
            sleep 20
          done
          echo "Image did not become available in GHCR within expected time."
          exit 1

  test-pytorchsim-wrapper1:
    needs: build-and-test
    uses: ./.github/workflows/pytorchsim_test.yml
    with:
      image_name: ghcr.io/psal-postech/torchsim-test:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      togsim_config: /workspace/PyTorchSim/configs/systolic_ws_256x256_c1_simple_noc_tpuv6e_functional_only.yml
      run_accuracy: true

  test-pytorchsim-wrapper2:
    needs: build-and-test
    uses: ./.github/workflows/pytorchsim_test.yml
    with:
      image_name: ghcr.io/psal-postech/torchsim-test:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      togsim_config: /workspace/PyTorchSim/configs/systolic_ws_32x32_c1_simple_noc_tpuv3.yml
      run_accuracy: false

  test-pytorchsim-wrapper3:
    needs: build-and-test
    uses: ./.github/workflows/pytorchsim_test.yml
    with:
      image_name: ghcr.io/psal-postech/torchsim-test:${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      togsim_config: /workspace/PyTorchSim/configs/systolic_ws_8x8_c1_simple_noc_tpuv3.yml
      run_accuracy: false
