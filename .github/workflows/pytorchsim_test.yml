name: PyTorchSim Tests

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      target:
        description: "TORCHSIM_TARGET, the machine: a TOGSim machine file ($TOGSIM_DIR/configs/<name>.yml) the kernels are compiled for and TOGSim times on"
        required: false
        default: "tpuv6e"
        type: string

# The list below is mirrored by hand from scripts/ci/triton_route_passing.txt, one container per
# test file, and is not identical to it: a file the allowlist runs as several entries (Gemma's
# --preset) runs here once without arguments, which runs the same presets in one process, and
# three tests/system tests the allowlist leaves out (test_compiler_failure, test_reduction_tiling,
# test_select) run here too.
# Regenerate the allowlist with
#   python scripts/ci/triton_route_sweep.py --all --update-allowlist
# and mirror its files here; a test absent from both is not gated anywhere.
#
# Runner policy: every job is self-hosted. The image carries the PyTorchSim-Triton-Backend
# toolchain layer (~1.8 GiB on top of the base), which is more than a
# GitHub-hosted runner should pull once per test.
jobs:
  test:
    name: ${{ matrix.test }}
    runs-on: [self-hosted, slurm, x86_64]
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/models/BERT/test_bert.py
          - tests/models/DeepSeek/test_deepseek_v3_base.py
          - tests/models/Diffusion/test_diffusion.py
          - tests/models/Gemma/test_gemma.py
          - tests/models/GPT2/test_gpt2.py
          - tests/models/Llama/test_llama.py
          - tests/models/Llama/test_llama3.py
          - tests/models/Llama/test_llama3x.py
          - tests/models/Llama/test_llama4.py
          - tests/models/Llama/test_mllama.py
          - tests/models/Mixtral8x7B/test_mistral.py
          - tests/models/MobileNet/test_mobilenet.py
          - tests/models/Qwen/test_qwen.py
          - tests/models/Qwen/test_qwen_next.py
          - tests/models/Yolo/test_yolo.py
          - tests/models/Yolov5/test_yolov5.py
          - tests/models/test_clip.py
          - tests/models/test_convnextv2.py
          - tests/models/test_resnet.py
          - tests/models/test_single_perceptron.py
          - tests/models/test_swinv2.py
          - tests/models/test_transformer.py
          - tests/models/test_vit.py
          - tests/ops/attention/test_fused_sdpa.py
          - tests/ops/attention/test_gqa.py
          - tests/ops/elementwise/test_activation.py
          - tests/ops/elementwise/test_add.py
          - tests/ops/elementwise/test_exponent.py
          - tests/ops/elementwise/test_transcendental.py
          - tests/ops/fusion/test_addmm_residual.py
          - tests/ops/fusion/test_matmul_scalar.py
          - tests/ops/fusion/test_matmul_vector.py
          - tests/ops/fusion/test_prologue_fusion.py
          - tests/ops/gemm/test_grouped_mm.py
          - tests/ops/gemm/test_row_matmul.py
          - tests/ops/misc/test_complex_to_real.py
          - tests/ops/misc/test_eager_to_compile_recursion.py
          - tests/ops/misc/test_expert_mask.py
          - tests/ops/misc/test_histc.py
          - tests/ops/misc/test_indirect_access.py
          - tests/ops/misc/test_inplace_partial_write.py
          - tests/ops/misc/test_polar.py
          - tests/ops/misc/test_user_triton_kernel.py
          - tests/ops/misc/test_widen_dtype.py
          - tests/ops/reduce/test_batchnorm.py
          - tests/ops/view/test_view3D_2D.py
          - tests/system/test_bundle_reuse.py
          - tests/system/test_compiler_failure.py
          - tests/system/test_eager.py
          - tests/system/test_patch_scope.py
          - tests/system/test_reduction_tiling.py
          - tests/system/test_select.py
          - tests/system/test_togsim_exit.py
          - tests/system/test_togsim_result.py
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove this repository's older images from the runner
        run: |
          keep='${{ inputs.image_name }}'
          for repo in ghcr.io/psal-postech/torchsim-test ghcr.io/psal-postech/torchsim_base; do
            docker images --format '{{.Repository}}:{{.Tag}}' "$repo"
          done | grep -v -x -F "$keep" | xargs -r docker rmi > /dev/null 2>&1 || true
          docker image prune -f > /dev/null 2>&1 || true
          free_gb() { df -BG --output=avail / | tail -1 | tr -dc 0-9; }
          if [ "$(free_gb)" -lt 40 ]; then
            echo "$(free_gb) GB free after removing this repository's images: removing every unused image and container on the runner"
            docker container prune -f > /dev/null 2>&1 || true
            docker image prune -af > /dev/null 2>&1 || true
          fi
          df -h / | tail -1
          docker images --format '{{.Size}}  {{.Repository}}:{{.Tag}}' 2>/dev/null | head -8

      - name: Run ${{ matrix.test }}
        run: |
          docker run --rm \
            -e TORCHSIM_TARGET="${{ inputs.target }}" \
            -e TORCHSIM_TIMING_MODE=0 \
            ${{ inputs.image_name }} python3 "PyTorchSim/${{ matrix.test }}"

