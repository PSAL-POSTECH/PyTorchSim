name: PyTorchSim Tests

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      togsim_config:
        description: "TOGSim hardware config YAML (single source of truth; drives both codegen and the cycle sim)"
        required: true
        type: string

# The list below IS scripts/ci/triton_route_passing.txt, one container per test.
# Regenerate that file with
#   python scripts/ci/triton_route_sweep.py --all --update-allowlist
# and mirror it here; a test absent from both is not gated anywhere.
#
# Runner policy: every job is self-hosted. The image carries the PyTorchSim-Triton-Backend
# toolchain layer (~1.8 GiB on top of the base), which is more than a
# GitHub-hosted runner should pull once per test.
jobs:
  test:
    name: ${{ matrix.test }}
    runs-on: [self-hosted, slurm, x86_64]
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/models/BERT/test_bert.py
          - tests/models/DeepSeek/test_deepseek_v3_base.py
          - tests/models/Diffusion/test_diffusion.py
          - tests/models/Gemma/test_gemma.py
          - tests/models/GPT2/test_gpt2.py
          - tests/models/Llama/test_llama.py
          - tests/models/Llama/test_llama3.py
          - tests/models/Llama/test_llama3x.py
          - tests/models/Llama/test_llama4.py
          - tests/models/Llama/test_mllama.py
          - tests/models/Mixtral8x7B/test_mistral.py
          - tests/models/MobileNet/test_mobilenet.py
          - tests/models/Qwen/test_qwen.py
          - tests/models/Qwen/test_qwen_next.py
          - tests/models/Yolo/test_yolo.py
          - tests/models/Yolov5/test_yolov5.py
          - tests/models/test_clip.py
          - tests/models/test_convnextv2.py
          - tests/models/test_resnet.py
          - tests/models/test_single_perceptron.py
          - tests/models/test_swinv2.py
          - tests/models/test_transformer.py
          - tests/models/test_vit.py
          - tests/ops/attention/test_gqa.py
          - tests/ops/elementwise/test_activation.py
          - tests/ops/elementwise/test_add.py
          - tests/ops/elementwise/test_exponent.py
          - tests/ops/elementwise/test_transcendental.py
          - tests/ops/fusion/test_addmm_residual.py
          - tests/ops/fusion/test_matmul_scalar.py
          - tests/ops/fusion/test_matmul_vector.py
          - tests/ops/fusion/test_prologue_fusion.py
          - tests/ops/misc/test_complex_to_real.py
          - tests/ops/misc/test_eager_to_compile_recursion.py
          - tests/ops/misc/test_expert_mask.py
          - tests/ops/misc/test_histc.py
          - tests/ops/misc/test_inplace_partial_write.py
          - tests/ops/misc/test_polar.py
          - tests/ops/misc/test_widen_dtype.py
          - tests/ops/reduce/test_batchnorm.py
          - tests/ops/view/test_view3D_2D.py
          - tests/system/test_eager.py
          - tests/system/test_patch_scope.py
          - tests/system/test_stonne.py
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run ${{ matrix.test }}
        run: |
          docker run --rm \
            -e TOGSIM_CONFIG="${{ inputs.togsim_config }}" \
            -e TORCHSIM_TIMING_MODE=0 \
            ${{ inputs.image_name }} python3 "PyTorchSim/${{ matrix.test }}"
