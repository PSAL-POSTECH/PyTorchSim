name: Triton codegen route (PyTorchSim-Triton-Backend)

# Exercises the Triton codegen route: Inductor's own Triton backend produces the
# kernel and PyTorchSim-Triton-Backend lowers it to a RISC-V ELF.
#
# Separate from the main CI on purpose: it runs when the compiler pin moves, and
# its sweep reports rather than gates.
#
# The base job makes sure of the base image; the route job (smoke + sweep) and the bundle job
# (the validation kernels for the compiler) then run beside each other in it. The base image is
# the compiler's published image at the pin plus the test stack (docker/Dockerfile.base); the
# compiler's package grants this repository read access, so the workflow's own token pulls it. The
# commit under test is not baked into an image: the checkout is mounted read-only and its device
# extension built in the container. What fails the route: no compiler image, the base build or its
# pull, the smoke kernels, the device extension, the job's time limit.

on:
  push:
    branches: [ "pytorchsim-triton-backend" ]
    paths:
      - 'pytorchsim/**'
      - 'third_party/pytorchsim-triton-backend.json'
      - 'docker/Dockerfile.base'
      - 'scripts/ci/third_party_base_pin.sh'
      - 'scripts/ci/triton_route_*'
      - 'scripts/ci/bundle.py'
      - 'scripts/ci/ptb_bundle_pr.sh'
      - 'scripts/ci/previous_bundle.sh'
      - '.github/workflows/pytorchsim_triton_backend.yml'
  workflow_dispatch:
    inputs:
      sweep_jobs:
        description: "Tests the sweep runs at once (empty: the sweep's default, 8 on a 16-CPU runner)"
        required: false
        default: ''

concurrency:
  group: triton-route-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_IMAGE_REPO: ghcr.io/psal-postech/torchsim_base
  PTB_IMAGE_REPO: ghcr.io/psal-postech/pytorchsim-triton-backend
  SOURCE_SHA: ${{ github.sha }}

jobs:
  # The base image the route and the bundle both run in, built and pushed when the pin has none; they
  # run beside each other after it.
  base:
    name: Base image
    # The aarch64 runners: the sweep takes half the time it takes on the x86_64 ones, and the pull a
    # sixth. They run rootless podman behind `docker`, without buildx, so the registry is asked with
    # curl and the base is built with plain docker build/push, as the compiler's own images workflow
    # does on aarch64. The base tag carries -arm64: docker-image.yml and tag_release.yml build the
    # x86_64 base under third_party-<PIN>.
    runs-on: [self-hosted, slurm, big, aarch64]
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.pin.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      # Credentials in the job's temp directory, gone with it -- not in the runner's home.
      - name: Registry login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          { echo "DOCKER_CONFIG=$RUNNER_TEMP/docker"; echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/docker/auth.json"; } >> "$GITHUB_ENV"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker" REGISTRY_AUTH_FILE="$RUNNER_TEMP/docker/auth.json"
          printf %s "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          uname -m; nproc; docker --version
      - name: Pins
        id: pin
        run: |
          PTB_REF=$(jq -r '.pytorchsim_triton_backend.ref' third_party/pytorchsim-triton-backend.json)
          PIN="$(bash scripts/ci/third_party_base_pin.sh)"
          echo "PTB_IMAGE=${PTB_IMAGE_REPO}:${PTB_REF}-runtime" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=${BASE_IMAGE_REPO}:third_party-${PIN}-arm64" >> "$GITHUB_ENV"
          echo "base=${BASE_IMAGE_REPO}:third_party-${PIN}-arm64" >> "$GITHUB_OUTPUT"
      - name: The compiler has published an image for the pin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(bash scripts/ci/ghcr_manifest_code.sh "${PTB_IMAGE}")
          echo "registry says $code for ${PTB_IMAGE}"
          if [ "$code" != 200 ]; then
            echo "::error::${PTB_IMAGE} is not in the registry: the compiler's images workflow pushes one tag per commit on its main and develop, and a pin elsewhere has none. If the tag exists, this repository has lost read access to the package."
            exit 1
          fi
      - name: Check base image exists
        id: exists
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(bash scripts/ci/ghcr_manifest_code.sh "${BASE_IMAGE}")
          echo "registry says $code for ${BASE_IMAGE}"
          if [ "$code" = 200 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push base image (missing pin)
        if: steps.exists.outputs.ok != 'true'
        run: |
          docker build -f docker/Dockerfile.base --build-arg PTB_IMAGE="${PTB_IMAGE}" -t "${BASE_IMAGE}" .
          docker push "${BASE_IMAGE}"

  route:
    name: Triton route (smoke gate + coverage sweep)
    needs: base
    runs-on: [self-hosted, slurm, big, aarch64]
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      BASE_IMAGE: ${{ needs.base.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      # Credentials in the job's temp directory, gone with it -- not in the runner's home.
      - name: Registry login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          { echo "DOCKER_CONFIG=$RUNNER_TEMP/docker"; echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/docker/auth.json"; } >> "$GITHUB_ENV"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker" REGISTRY_AUTH_FILE="$RUNNER_TEMP/docker/auth.json"
          printf %s "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          uname -m; nproc; docker --version

      - name: Pull the base image
        id: pull
        run: docker pull "${BASE_IMAGE}"

      # The harness's own kernels, end to end through Spike. This is the gate on
      # the toolchain itself: if these regress, nothing downstream is meaningful.
      #
      # tests/torchsim-compile and NOT pytorchsim-triton-compiler: the compiler driver stops at
      # the kernel object, so it would compile these and never run one. The
      # suite's driver registers the stages that run Spike and check the
      # numbers, which is the whole point of a smoke test.
      - name: doctor + add / mul / relu / gemm / bmm
        run: |
          docker run --rm "${BASE_IMAGE}" bash -lc '
              cd /workspace/pytorchsim-triton-compiler &&
              python3 tests/torchsim-compile doctor &&
              for k in add mul relu gemm bmm; do
                echo "=== $k ===" && python3 tests/torchsim-compile tests/cases/smoke/$k.py || exit 1
              done'

      # Only orders the sweep (longest test first), so a miss costs time and nothing
      # else. In a container of its own: the token never reaches the tests.
      - name: Durations of the previous sweep (best effort)
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sweep-prev && chmod 777 sweep-prev
          docker run --rm -e GH_TOKEN -e GITHUB_RUN_ID -e GITHUB_API_URL \
            -v "$PWD:/src:ro" -v "$PWD/sweep-prev:/out" "${BASE_IMAGE}" \
            python3 /src/scripts/ci/triton_route_previous.py "${GITHUB_REPOSITORY}" /out/results.json

      # Runs whether or not the smoke kernels held. Reports every test, allowlist
      # included; each failure leaves its kernel and stage IR behind. A device
      # extension that does not build fails the step, a sweep result does not. A test on the
      # allowlist gets twice the time: the slowest one runs within seconds of 900.
      - name: Device extension + full sweep (the sweep reports)
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        env:
          SWEEP_JOBS: ${{ inputs.sweep_jobs }}
        run: |
          case "$SWEEP_JOBS" in
            ''|[1-9]|[1-9][0-9]) ;;
            *) echo "::error::sweep_jobs is '$SWEEP_JOBS'; it is a number from 1 to 99, or empty"; exit 1 ;;
          esac
          mkdir -p sweep sweep-prev && chmod 777 sweep
          rc=0
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/sweep:/sweep" "${BASE_IMAGE}" \
            bash /src/scripts/ci/triton_route_in_container.sh --all \
              --timeout 900 --allowlist-timeout 1800 --order-from /src/sweep-prev/results.json \
              ${SWEEP_JOBS:+-j "$SWEEP_JOBS"} --json /sweep/results.json \
              --markdown /sweep/coverage.md --artifacts /sweep/failures || rc=$?
          if [ ! -f sweep/device-built ]; then
            echo "::error::the device extension did not build (exit $rc)"
            exit 1
          fi
          rm -f sweep/device-built
          if [ "$rc" -ne 0 ]; then
            echo "::warning::the sweep container exited $rc"
          fi
          if [ -f sweep/coverage.md ]; then
            cat sweep/coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the sweep wrote no report"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triton-route-coverage
          path: sweep/
          if-no-files-found: warn

  # The kernels PyTorchSim builds for the compiler's validation workloads, at the configs the
  # selection record holds (scripts/ci/bundle.py), proposed to the compiler as a pull request
  # when they changed. Beside the route job, in the base image the base job made sure of.
  bundle:
    name: Validation kernel bundle
    needs: base
    runs-on: [self-hosted, slurm, big, aarch64]
    timeout-minutes: 240
    permissions:
      contents: read
      packages: read
      actions: read
    env:
      BASE_IMAGE: ${{ needs.base.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Registry login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          { echo "DOCKER_CONFIG=$RUNNER_TEMP/docker"; echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/docker/auth.json"; } >> "$GITHUB_ENV"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker" REGISTRY_AUTH_FILE="$RUNNER_TEMP/docker/auth.json"
          printf %s "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Pull the base image
        run: docker pull "$BASE_IMAGE"
      # The last bundle on the branch, its record and its kernels: a config the record holds is taken without
      # timing it, and a workload whose key it holds is copied without building it.
      - name: Previous bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: rm -rf picks prev && bash scripts/ci/previous_bundle.sh picks prev
      # The GEMMs and the layer (its projections are mm templates) in timing mode, their configs picked by
      # TOGSim cycles where the record has none, beside the other suites without it: three runs, since a
      # process keeps the timing mode it started in. The GEMMs build in four processes, largest first. The
      # layer, only its rows under the compiler's CI cap, builds in four processes (87 min measured, against ~3.8 h in one: its prefill at S 4096 alone is ~85 min).
      # The record, with this run's picks folded in, and the workloads' keys are uploaded beside the bundle
      # (bundle/record, bundle/keys) for the next run; PTS_INPUTS are the git ids the keys hash.
      - name: Build the bundle
        run: |
          mkdir -p bundle && chmod 777 bundle
          PTS_INPUTS="$(git rev-parse HEAD:pytorchsim HEAD:device HEAD:scripts/ci/bundle.py | tr '\n' ' ')"
          docker run --rm -e PTS_COMMIT="$SOURCE_SHA" -e PTS_INPUTS="$PTS_INPUTS" -e BASE_IMAGE -e TORCHSIM_FUNCTIONAL_MODE=0 \
            -v "$PWD:/src:ro" -v "$PWD/picks:/picks:ro" -v "$PWD/prev:/prev:ro" -v "$PWD/bundle:/bundle" "${BASE_IMAGE}" bash -lc '
              set -euo pipefail
              mkdir -p "$TORCHSIM_DIR"
              tar -C /src --exclude=./.git --exclude=./.github -cf - . | tar -C "$TORCHSIM_DIR" -xf -
              (cd "$TORCHSIM_DIR/device" && python -m pip install -q --no-build-isolation -e .)
              cd "$TORCHSIM_DIR"
              mkdir -p pytorchsim/selection && cp /picks/*.json pytorchsim/selection/ 2>/dev/null || true
              TORCHSIM_TIMING_MODE=1 TORCHSIM_DUMP_PATH=/tmp/gemm python3 scripts/ci/bundle.py /bundle/out gemm --jobs 4 --reuse /prev \
                > /bundle/gemm.log 2>&1 & gemm=$!
              TORCHSIM_TIMING_MODE=1 TORCHSIM_DUMP_PATH=/tmp/layer python3 scripts/ci/bundle.py /bundle/out layer --jobs 4 --reuse /prev \
                > /bundle/layer.log 2>&1 & layer=$!
              TORCHSIM_DUMP_PATH=/tmp/rest python3 scripts/ci/bundle.py /bundle/out vector attention --reuse /prev \
                > /bundle/rest.log 2>&1 & rest=$!
              rc=0; wait $gemm || rc=1; wait $layer || rc=1; wait $rest || rc=1
              grep "^\[bundle\]" /bundle/gemm.log /bundle/layer.log /bundle/rest.log || true
              picks=""; for f in /tmp/gemm/selection.jsonl /tmp/layer/selection.jsonl; do if [ -s "$f" ]; then picks="$picks $f"; fi; done
              if [ -n "$picks" ]; then
                python3 scripts/selection_merge.py $picks
              fi
              mkdir -p /bundle/record && cp pytorchsim/selection/*.json /bundle/record/ 2>/dev/null || true
              exit $rc'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pts-bundle
          path: bundle/
      - name: Propose it to the compiler
        if: github.event_name == 'push'
        env:
          PTB_TOKEN: ${{ secrets.PTB_BUNDLE_TOKEN }}
        run: |
          if [ -z "$PTB_TOKEN" ]; then echo "::error::the PTB_BUNDLE_TOKEN secret is not set: no bundle pull request for the compiler"; exit 1; fi
          BUNDLE=bundle/out bash scripts/ci/ptb_bundle_pr.sh
