name: Triton codegen route (PyTorchSim-Triton-Backend)

# Exercises the Triton codegen route: Inductor's own Triton backend produces the
# kernel and PyTorchSim-Triton-Backend lowers it to a RISC-V ELF.
#
# Separate from the main CI on purpose: it runs when the compiler pin moves, and
# its sweep reports rather than gates.
#
# The base image is the compiler's published image at the pin plus the test stack (Dockerfile.base);
# the compiler's package grants this repository read access, so no token is involved.
# and its vcix-accelerator submodule. Both are private and the default Actions token is
# scoped to this repository. preflight checks it before the docker build.

on:
  pull_request:
    branches: [ "master", "develop", "pytorchsim-triton-backend" ]
    paths:
      - 'PyTorchSimCodegen/**'
      - 'Simulator/**'
      - 'PyTorchSimFrontend/**'
      - 'thirdparty/pytorchsim-triton-backend.json'
      - 'Dockerfile.base'
      - 'scripts/ci/thirdparty_base_pin.sh'
      - 'scripts/ci/triton_route_passing.txt'
      - '.github/workflows/pytorchsim_triton_backend.yml'
  workflow_dispatch:

env:
  BASE_IMAGE_REPO: ghcr.io/psal-postech/torchsim_base
  PTB_IMAGE_REPO: ghcr.io/psal-postech/pytorchsim-triton-backend
  APP_IMAGE_REPO: ghcr.io/psal-postech/torchsim_ptb
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  ensure-base:
    name: Base image on the compiler's
    runs-on: [self-hosted, slurm, big, x86_64]
    outputs:
      base_image: ${{ steps.pin.outputs.base_image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pins
        id: pin
        run: |
          PTB_REF=$(jq -r '.pytorchsim_triton_backend.ref' thirdparty/pytorchsim-triton-backend.json)
          PIN="$(bash scripts/ci/thirdparty_base_pin.sh)"
          echo "PTB_IMAGE=${PTB_IMAGE_REPO}:${PTB_REF}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=${BASE_IMAGE_REPO}:thirdparty-${PIN}" >> "$GITHUB_ENV"
          echo "base_image=${BASE_IMAGE_REPO}:thirdparty-${PIN}" >> "$GITHUB_OUTPUT"
      - name: The compiler has published an image for the pin
        run: |
          if ! docker manifest inspect "${PTB_IMAGE}" > /dev/null 2> inspect.err; then
            echo "docker manifest inspect: $(cat inspect.err)"
            echo "::error::${PTB_IMAGE} is not in the registry: the compiler's images workflow pushes one tag per commit on its main and develop, and a pin elsewhere has none. If the tag exists, this repository has lost read access to the package."
            exit 1
          fi
      - name: Check base image exists
        id: exists
        run: |
          if docker manifest inspect "${BASE_IMAGE}" > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push base image (missing pin)
        if: steps.exists.outputs.ok != 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          build-args: |
            PTB_IMAGE=${{ env.PTB_IMAGE }}
          tags: ${{ env.BASE_IMAGE }}

  build-app:
    name: Build app image on the base
    needs: ensure-base
    runs-on: [self-hosted, slurm, big, x86_64]
    outputs:
      app_image: ${{ steps.name.outputs.app_image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "app_image=${APP_IMAGE_REPO}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.ensure-base.outputs.base_image }}
          tags: ${{ steps.name.outputs.app_image }}

  ptb-baselines:
    name: PyTorchSim-Triton-Backend baselines
    needs: build-app
    runs-on: [self-hosted, slurm, x86_64]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The harness's own kernels, end to end through Spike. This is the gate on
      # the toolchain itself: if these regress, nothing downstream is meaningful.
      #
      # tests/torchsim-compile and NOT pytorchsim-triton-compiler: the compiler driver stops at
      # the kernel object, so it would compile these and never run one. The
      # suite's driver registers the stages that run Spike and check the
      # numbers, which is the whole point of a smoke test.
      - name: doctor + add / mul / relu / gemm / bmm
        run: |
          docker run --rm \
            ${{ needs.build-app.outputs.app_image }} bash -lc '
              cd /workspace/pytorchsim-triton-compiler &&
              python3 tests/torchsim-compile doctor &&
              for k in add mul relu gemm bmm; do
                echo "=== $k ===" && python3 tests/torchsim-compile tests/cases/smoke/$k.py || exit 1
              done'

  coverage-sweep:
    name: Coverage sweep beyond the allowlist
    needs: build-app
    runs-on: [self-hosted, slurm, big, x86_64]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reports every test, allowlist included. Each failure leaves its kernel
      # and stage IR behind. pytorchsim_test.yml is what gates the allowlist.
      - name: Full sweep (report)
        continue-on-error: true
        run: |
          mkdir -p sweep && chmod 777 sweep
          docker run --rm -v "$PWD/sweep:/sweep" \
            ${{ needs.build-app.outputs.app_image }} \
            python3 PyTorchSim/scripts/ci/triton_route_sweep.py --all \
              --timeout 900 --json /sweep/results.json \
              --markdown /sweep/coverage.md --artifacts /sweep/failures
          cat sweep/coverage.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triton-route-coverage
          path: sweep/
          if-no-files-found: warn
