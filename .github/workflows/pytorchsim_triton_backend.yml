name: Triton codegen route (PyTorchSim-Triton-Backend)

# Exercises the Triton codegen route: Inductor's own Triton backend produces the
# kernel and PyTorchSim-Triton-Backend lowers it to a RISC-V ELF.
#
# Separate from the main CI on purpose: it runs when the compiler pin moves, and
# its sweep reports rather than gates.
#
# One job, one image pull. The base image is the compiler's published image at the pin plus the
# test stack (docker/Dockerfile.base); the compiler's package grants this repository read access,
# so the workflow's own token pulls it. The commit under test is not baked into an image: the checkout is
# mounted read-only and scripts/ci/triton_route_in_container.sh builds its device extension there.
# What fails the run: no compiler image, the base build or its pull, the smoke kernels, the device
# extension, the job's time limit.

on:
  push:
    branches: [ "pytorchsim-triton-backend" ]
    paths:
      - 'pytorchsim/**'
      - 'third_party/pytorchsim-triton-backend.json'
      - 'docker/Dockerfile.base'
      - 'scripts/ci/third_party_base_pin.sh'
      - 'scripts/ci/triton_route_*'
      - '.github/workflows/pytorchsim_triton_backend.yml'
  workflow_dispatch:
    inputs:
      sweep_jobs:
        description: "Tests the sweep runs at once (empty: the sweep's default, 8 on a 16-CPU runner)"
        required: false
        default: ''

concurrency:
  group: triton-route-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_IMAGE_REPO: ghcr.io/psal-postech/torchsim_base
  PTB_IMAGE_REPO: ghcr.io/psal-postech/pytorchsim-triton-backend
  SOURCE_SHA: ${{ github.sha }}

jobs:
  route:
    name: Triton route (smoke gate + coverage sweep)
    # PoC: the aarch64 runners (Mac Studio nodes, rootless podman behind `docker`). No buildx there,
    # so the registry is asked with curl and the base is built with plain docker build/push, as the
    # compiler's own images workflow does on aarch64. The base tag carries -arm64 so the x64 tag is untouched.
    runs-on: [self-hosted, slurm, big, aarch64]
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      # Credentials in the job's temp directory, gone with it -- not in the runner's home.
      - name: Registry login
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker"
          { echo "DOCKER_CONFIG=$RUNNER_TEMP/docker"; echo "REGISTRY_AUTH_FILE=$RUNNER_TEMP/docker/auth.json"; } >> "$GITHUB_ENV"
          export DOCKER_CONFIG="$RUNNER_TEMP/docker" REGISTRY_AUTH_FILE="$RUNNER_TEMP/docker/auth.json"
          printf %s "$TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          uname -m; nproc; docker --version
      - name: Pins
        id: pin
        run: |
          PTB_REF=$(jq -r '.pytorchsim_triton_backend.ref' third_party/pytorchsim-triton-backend.json)
          PIN="$(bash scripts/ci/third_party_base_pin.sh)"
          echo "PTB_IMAGE=${PTB_IMAGE_REPO}:${PTB_REF}-runtime" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=${BASE_IMAGE_REPO}:third_party-${PIN}-arm64" >> "$GITHUB_ENV"
      - name: The compiler has published an image for the pin
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(bash scripts/ci/ghcr_manifest_code.sh "${PTB_IMAGE}")
          echo "registry says $code for ${PTB_IMAGE}"
          if [ "$code" != 200 ]; then
            echo "::error::${PTB_IMAGE} is not in the registry: the compiler's images workflow pushes one tag per commit on its main and develop, and a pin elsewhere has none. If the tag exists, this repository has lost read access to the package."
            exit 1
          fi
      - name: Check base image exists
        id: exists
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(bash scripts/ci/ghcr_manifest_code.sh "${BASE_IMAGE}")
          echo "registry says $code for ${BASE_IMAGE}"
          if [ "$code" = 200 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push base image (missing pin)
        if: steps.exists.outputs.ok != 'true'
        run: |
          docker build -f docker/Dockerfile.base --build-arg PTB_IMAGE="${PTB_IMAGE}" -t "${BASE_IMAGE}" .
          docker push "${BASE_IMAGE}"

      - name: Pull the base image
        id: pull
        run: docker pull "${BASE_IMAGE}"

      # The harness's own kernels, end to end through Spike. This is the gate on
      # the toolchain itself: if these regress, nothing downstream is meaningful.
      #
      # tests/torchsim-compile and NOT pytorchsim-triton-compiler: the compiler driver stops at
      # the kernel object, so it would compile these and never run one. The
      # suite's driver registers the stages that run Spike and check the
      # numbers, which is the whole point of a smoke test.
      - name: doctor + add / mul / relu / gemm / bmm
        run: |
          docker run --rm "${BASE_IMAGE}" bash -lc '
              cd /workspace/pytorchsim-triton-compiler &&
              python3 tests/torchsim-compile doctor &&
              for k in add mul relu gemm bmm; do
                echo "=== $k ===" && python3 tests/torchsim-compile tests/cases/smoke/$k.py || exit 1
              done'

      # Only orders the sweep (longest test first), so a miss costs time and nothing
      # else. In a container of its own: the token never reaches the tests.
      - name: Durations of the previous sweep (best effort)
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sweep-prev && chmod 777 sweep-prev
          docker run --rm -e GH_TOKEN -e GITHUB_RUN_ID -e GITHUB_API_URL \
            -v "$PWD:/src:ro" -v "$PWD/sweep-prev:/out" "${BASE_IMAGE}" \
            python3 /src/scripts/ci/triton_route_previous.py "${GITHUB_REPOSITORY}" /out/results.json

      # Runs whether or not the smoke kernels held. Reports every test, allowlist
      # included; each failure leaves its kernel and stage IR behind. A device
      # extension that does not build fails the step, a sweep result does not. A test on the
      # allowlist gets twice the time: the slowest one runs within seconds of 900.
      - name: Device extension + full sweep (the sweep reports)
        if: ${{ !cancelled() && steps.pull.outcome == 'success' }}
        env:
          SWEEP_JOBS: ${{ inputs.sweep_jobs }}
        run: |
          case "$SWEEP_JOBS" in
            ''|[1-9]|[1-9][0-9]) ;;
            *) echo "::error::sweep_jobs is '$SWEEP_JOBS'; it is a number from 1 to 99, or empty"; exit 1 ;;
          esac
          mkdir -p sweep sweep-prev && chmod 777 sweep
          rc=0
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/sweep:/sweep" "${BASE_IMAGE}" \
            bash /src/scripts/ci/triton_route_in_container.sh --all \
              --timeout 900 --allowlist-timeout 1800 --order-from /src/sweep-prev/results.json \
              ${SWEEP_JOBS:+-j "$SWEEP_JOBS"} --json /sweep/results.json \
              --markdown /sweep/coverage.md --artifacts /sweep/failures || rc=$?
          if [ ! -f sweep/device-built ]; then
            echo "::error::the device extension did not build (exit $rc)"
            exit 1
          fi
          rm -f sweep/device-built
          if [ "$rc" -ne 0 ]; then
            echo "::warning::the sweep container exited $rc"
          fi
          if [ -f sweep/coverage.md ]; then
            cat sweep/coverage.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the sweep wrote no report"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # Not triton-route-coverage: the x64 sweep must not order itself by arm64 durations.
          name: triton-route-coverage-arm64
          path: sweep/
          if-no-files-found: warn
