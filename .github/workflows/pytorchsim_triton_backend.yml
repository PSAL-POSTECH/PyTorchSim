name: Triton codegen route (PyTorchSim-Triton-Backend)

# Exercises the Triton codegen route: Inductor's own Triton backend produces the
# kernel and PyTorchSim-Triton-Backend lowers it to a RISC-V ELF.
# (PyTorchSimFrontend/triton_backend/README.md)
#
# Separate from the main CI on purpose: it runs when the compiler pin moves, and
# its sweep reports rather than gates.
#
# Needs secrets.TNPU_TOKEN: a PAT that can read PSAL-POSTECH/PyTorchSim-Triton-Backend
# and its vcix-accelerator submodule. Both are private and the default Actions token is
# scoped to this repository. preflight checks it before the docker build.

on:
  pull_request:
    branches: [ "master", "develop" ]
    paths:
      - 'PyTorchSimFrontend/triton_backend/**'
      - 'PyTorchSimFrontend/tog/**'
      - 'thirdparty/pytorchsim-triton-backend.json'
      - 'Dockerfile.ptb'
      - 'scripts/ci/ptb_base_pin.sh'
      - 'scripts/ci/triton_route_passing.txt'
      - '.github/workflows/pytorchsim_triton_backend.yml'
  workflow_dispatch:

env:
  BASE_IMAGE_REPO: ghcr.io/psal-postech/torchsim_base
  PTB_IMAGE_REPO: ghcr.io/psal-postech/torchsim_ptb_base
  APP_IMAGE_REPO: ghcr.io/psal-postech/torchsim_ptb
  SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: Check PTB access
    runs-on: [self-hosted, slurm, x86_64]
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Token can read the pin
        id: check
        env:
          PTB_TOKEN: ${{ secrets.TNPU_TOKEN }}
        run: |
          if [ -z "${PTB_TOKEN}" ]; then
            echo "::error::secrets.TNPU_TOKEN is not set. PSAL-POSTECH/PyTorchSim-Triton-Backend is private and the default Actions token cannot read it."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 1
          fi
          REPO=$(jq -r '.pytorchsim_triton_backend.repository' thirdparty/pytorchsim-triton-backend.json)
          REF=$(jq -r '.pytorchsim_triton_backend.ref' thirdparty/pytorchsim-triton-backend.json)
          if ! curl -fsS -H "Authorization: Bearer ${PTB_TOKEN}" \
               "https://api.github.com/repos/${REPO}/commits/${REF}" -o /dev/null; then
            echo "::error::PTB_TOKEN cannot read ${REPO} at ${REF}."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  ensure-ptb-base:
    name: Build PTB toolchain image
    needs: preflight
    runs-on: [self-hosted, slurm, big, x86_64]
    outputs:
      ptb_image: ${{ steps.pin.outputs.ptb_image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pins
        id: pin
        run: |
          BASE_PIN="$(bash scripts/ci/thirdparty_base_pin.sh)"
          PTB_PIN="$(bash scripts/ci/ptb_base_pin.sh)"
          echo "BASE_IMAGE=${BASE_IMAGE_REPO}:thirdparty-${BASE_PIN}" >> "$GITHUB_ENV"
          # The PTB layer sits on a specific base, so its tag carries both pins.
          echo "PTB_IMAGE=${PTB_IMAGE_REPO}:ptb-${PTB_PIN}-base-${BASE_PIN}" >> "$GITHUB_ENV"
          echo "ptb_image=${PTB_IMAGE_REPO}:ptb-${PTB_PIN}-base-${BASE_PIN}" >> "$GITHUB_OUTPUT"
          echo "PTB_REF=$(jq -r '.pytorchsim_triton_backend.ref' thirdparty/pytorchsim-triton-backend.json)" >> "$GITHUB_ENV"

      - name: Check PTB image exists
        id: exists
        run: |
          if docker manifest inspect "${PTB_IMAGE}" > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push PTB toolchain image
        if: steps.exists.outputs.ok != 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.ptb
          push: true
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
            PTB_REF=${{ env.PTB_REF }}
          secrets: |
            ptb_token=${{ secrets.TNPU_TOKEN }}
          tags: ${{ env.PTB_IMAGE }}

  build-app:
    name: Build app image on PTB base
    needs: ensure-ptb-base
    runs-on: [self-hosted, slurm, big, x86_64]
    outputs:
      app_image: ${{ steps.name.outputs.app_image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          submodules: recursive
          persist-credentials: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: name
        run: echo "app_image=${APP_IMAGE_REPO}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=${{ needs.ensure-ptb-base.outputs.ptb_image }}
          tags: ${{ steps.name.outputs.app_image }}

  ptb-baselines:
    name: PyTorchSim-Triton-Backend baselines
    needs: build-app
    runs-on: [self-hosted, slurm, x86_64]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The harness's own kernels, end to end through Spike. This is the gate on
      # the toolchain itself: if these regress, nothing downstream is meaningful.
      #
      # tests/torchsim-compile and NOT pytorchsim-triton-compiler: the compiler driver stops at
      # the kernel object, so it would compile these and never run one. The
      # suite's driver registers the stages that run Spike and check the
      # numbers, which is the whole point of a smoke test.
      - name: doctor + add / mul / relu / gemm / bmm
        run: |
          docker run --rm \
            ${{ needs.build-app.outputs.app_image }} bash -lc '
              cd /workspace/pytorchsim-triton-compiler &&
              python3 tests/torchsim-compile doctor &&
              for k in add mul relu gemm bmm; do
                echo "=== $k ===" && python3 tests/torchsim-compile tests/cases/smoke/$k.py || exit 1
              done'

  triton-route:
    name: Inductor Triton route
    needs: build-app
    runs-on: [self-hosted, slurm, x86_64]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: test_triton_codegen.py
        run: |
          docker run --rm \
            ${{ needs.build-app.outputs.app_image }} \
            python3 PyTorchSim/tests/system/test_triton_codegen.py

  coverage-sweep:
    name: Coverage sweep beyond the allowlist
    needs: build-app
    runs-on: [self-hosted, slurm, big, x86_64]
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reports every test, allowlist included. Each failure leaves its kernel
      # and stage IR behind. pytorchsim_test.yml is what gates the allowlist.
      - name: Full sweep (report)
        continue-on-error: true
        run: |
          mkdir -p sweep && chmod 777 sweep
          docker run --rm -v "$PWD/sweep:/sweep" \
            ${{ needs.build-app.outputs.app_image }} \
            python3 PyTorchSim/scripts/ci/triton_route_sweep.py --all \
              --timeout 900 --json /sweep/results.json \
              --markdown /sweep/coverage.md --artifacts /sweep/failures
          cat sweep/coverage.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: triton-route-coverage
          path: sweep/
          if-no-files-found: warn
