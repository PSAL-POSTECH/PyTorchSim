name: Build & Push Docker Image on Tag

on:
  push:
    tags:
      - 'v*'

env:
  BASE_IMAGE_REPO: ghcr.io/psal-postech/torchsim_base
  PTB_IMAGE_REPO: ghcr.io/psal-postech/pytorchsim-triton-backend

jobs:
  ensure-base:
    name: Base image on the compiler's
    runs-on: [self-hosted, slurm, big, x86_64]
    outputs:
      base_image: ${{ steps.pin.outputs.base_image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: PSAL-POSTECH/PyTorchSim
          ref: ${{ github.sha }}
          submodules: recursive
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pins
        id: pin
        run: |
          PTB_REF=$(jq -r '.pytorchsim_triton_backend.ref' thirdparty/pytorchsim-triton-backend.json)
          PIN="$(bash scripts/ci/thirdparty_base_pin.sh)"
          echo "PTB_IMAGE=${PTB_IMAGE_REPO}:${PTB_REF}" >> "$GITHUB_ENV"
          echo "BASE_IMAGE=${BASE_IMAGE_REPO}:thirdparty-${PIN}" >> "$GITHUB_ENV"
          echo "base_image=${BASE_IMAGE_REPO}:thirdparty-${PIN}" >> "$GITHUB_OUTPUT"
      - name: The compiler has published an image for the pin
        run: |
          if ! docker manifest inspect "${PTB_IMAGE}" > /dev/null 2>&1; then
            echo "::error::${PTB_IMAGE} is not in the registry: the compiler's images workflow pushes one tag per commit on its main and develop, and a pin elsewhere has none. If the tag exists, this repository has lost read access to the package."
            exit 1
          fi
      - name: Check base image exists
        id: exists
        run: |
          if docker manifest inspect "${BASE_IMAGE}" > /dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push base image (missing pin)
        if: steps.exists.outputs.ok != 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.base
          push: true
          build-args: |
            PTB_IMAGE=${{ env.PTB_IMAGE }}
          tags: |
            ${{ env.BASE_IMAGE }}
            ${{ env.BASE_IMAGE_REPO }}:latest

  build:
    needs: ensure-base
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: PSAL-POSTECH/PyTorchSim
          ref: ${{ github.ref_name }}
          submodules: recursive
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Tag Environment
        run: |
          echo "IMAGE_TAG=torchsim-ci:${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          echo "GITHUB_SHA=$GITHUB_SHA" >> $GITHUB_ENV
          echo "GITHUB_SHA=$GITHUB_SHA"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          secrets: |
            GIT_ACCESS_TOKEN=${{ secrets.GIT_ACCESS_TOKEN }}
          build-args: |
            BASE_IMAGE=${{ needs.ensure-base.outputs.base_image }}
          tags: ghcr.io/psal-postech/${{ env.IMAGE_TAG }}
