# TPU v6e timing config for the sim-vs-TPU comparison: TOGSim's
# configs/systolic_ws_256x256_c1_simple_noc_tpuv6e_timing_only.yml with ONE change, no L2 cache
# (v6e has none between HBM and VMEM). run.py expands $TOGSIM_DIR, applies any --set key=value
# and writes the result to runs/<tag>/config.yml, which is the file every shape of that tag runs on.
num_cores: 1
core_freq_mhz: 3502
core_stats_print_period_cycles: 200
num_systolic_array_per_core: 2

vpu_num_lanes: 256
vpu_spad_size_kb_per_lane: 512
vpu_vector_length_bits: 512
tpu_systolic_queue_entries: 256

dram_type: ramulator2
dram_channels: 32
dram_stats_print_period_cycles: 200
ramulator_config_path: $TOGSIM_DIR/configs/ramulator2_configs/HBM3_TPUv6e.yaml
l2d_type: nocache

icnt_type: simple
icnt_latency_cycles: 10
icnt_freq_mhz: 3502
icnt_injection_ports_per_core: 16

pytorchsim_functional_mode: 0
pytorchsim_timing_mode: 1

codegen_mapping_strategy: autotune
codegen_external_mapping_file: ''
codegen_autotune_max_retry: 10
codegen_autotune_template_topk: 4
codegen_compiler_optimization: all

# Per-core VMEM (vector/scratchpad) size, so TOGSim charges tiles for it instead
# of modelling an infinite spad: vpu_spad_size_kb_per_lane x vpu_num_lanes,
# the same identity the v2/v3/v4 configs hold (128 x 128 = 16384). 512 x 256 = 128 MB.
core_spad_size_kb: 131072
